<section id="loginCard" class="card login-card">

  <div class="login-logo">
    🤝
  </div>

  <span class="login-badge">🔐 SECURE ADMIN PORTAL</span>

  <h1>Welcome back</h1>

  <p class="muted">
    Sign in to manage and respond to submitted concerns.
  </p>

  <form id="loginForm">

    <label>
      Username
      <div class="input-box">
        <span>👤</span>
        <input
          name="username"
          required
          autocomplete="username"
          placeholder="Enter your username"
        >
      </div>
    </label>

    <label>
      Password
      <div class="input-box">
        <span>🔑</span>
        <input
          id="adminPassword"
          type="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
        >
        <button
          type="button"
          class="password-toggle"
          onclick="togglePassword()"
        >
          👁
        </button>
      </div>
    </label>

    <button type="submit" class="admin-login-btn">
      Login to Dashboard →
    </button>

    <div id="loginMsg"></div>

  </form>

  <a href="/" class="back-home">
    ← Back to Seva Swasthya
  </a>

</section>
