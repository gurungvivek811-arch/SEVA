<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Admin Portal - Seva Swasthya</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(50,190,225,.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(110,105,235,.16),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f5fbff,
          #f8f7ff
        );

      color: #263852;

      min-height: 100vh;
    }


    /* =====================================
       TOP BAR
    ===================================== */

    .admin-topbar {

      width: 100%;

      min-height: 76px;

      padding:
        0 5%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid
        rgba(215,228,238,.8);

      background:
        rgba(255,255,255,.82);

      backdrop-filter:
        blur(18px);

      position: sticky;

      top: 0;

      z-index: 50;
    }


    .admin-brand {

      display: flex;

      align-items: center;

      gap: 12px;

      color: #183d55;

      text-decoration: none;

      font-weight: 900;

      letter-spacing: 1px;

      font-size: 17px;
    }


    .admin-brand-icon {

      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #dff8ff,
          #eeeaff
        );

      font-size: 21px;

      box-shadow:
        0 8px 20px
        rgba(65,115,145,.12);
    }


    .admin-title {

      color: #718197;

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    #logout {

      display: none;

      border: 0;

      padding:
        10px 17px;

      border-radius: 11px;

      background: #fff;

      color: #60758a;

      border:
        1px solid
        #dce6ed;

      cursor: pointer;

      font-weight: 800;

      transition: .2s ease;
    }


    #logout:hover {

      color: #c13d4a;

      border-color:
        #f0bcc2;

      background: #fff6f7;
    }


    /* =====================================
       MAIN
    ===================================== */

    .admin-wrap {

      width: 92%;

      max-width: 1180px;

      margin: 0 auto;

      padding:
        45px 0 80px;
    }


    /* =====================================
       LOGIN CARD
    ===================================== */

    .login-card {

      width: 100%;

      max-width: 470px;

      margin:
        35px auto 70px;

      padding: 44px;

      text-align: center;

      background:
        rgba(255,255,255,.94);

      border:
        1px solid
        rgba(255,255,255,.95);

      border-radius: 30px;

      box-shadow:
        0 25px 75px
        rgba(45,82,110,.15);

      backdrop-filter:
        blur(18px);

      animation:
        loginAppear .6s ease;
    }


    @keyframes loginAppear {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    .login-logo {

      width: 82px;

      height: 82px;

      margin:
        0 auto 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          #e4faff,
          #efecff
        );

      font-size: 40px;

      box-shadow:
        0 13px 30px
        rgba(68,110,145,.14);
    }


    .login-badge {

      display: inline-block;

      padding:
        8px 15px;

      border-radius: 50px;

      background: #f0f9fc;

      border:
        1px solid
        #dceef4;

      color: #39819c;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.4px;

      margin-bottom: 16px;
    }


    .login-card h1 {

      margin:
        0 0 10px;

      font-size: 35px;

      line-height: 1.15;

      color: #263852;

      letter-spacing: -.7px;
    }


    .login-card .muted {

      margin:
        0 0 28px;

      color: #748397;

      font-size: 14px;

      line-height: 1.6;
    }


    .login-card form {

      text-align: left;
    }


    .login-card label {

      display: block;

      margin-top: 19px;

      color: #344b61;

      font-size: 13px;

      font-weight: 800;
    }


    .input-box {

      position: relative;

      display: flex;

      align-items: center;

      margin-top: 8px;

      height: 54px;

      background: #fbfdff;

      border:
        1px solid
        #dce6ee;

      border-radius: 14px;

      transition: .25s ease;
    }


    .input-box > span {

      width: 48px;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 18px;

      opacity: .8;
    }


    .input-box input {

      flex: 1;

      width: 100%;

      height: 100%;

      border: none !important;

      outline: none !important;

      background: transparent !important;

      box-shadow: none !important;

      padding:
        0 8px 0 0 !important;

      margin: 0 !important;

      color: #263852;

      font-size: 15px;
    }


    .input-box:focus-within {

      border-color:
        #50b6d5;

      background: #fff;

      box-shadow:
        0 0 0 4px
        rgba(80,182,213,.12);
    }


    .password-toggle {

      width: 50px;

      height: 52px;

      padding: 0;

      border: none;

      background: transparent;

      color: #718096;

      cursor: pointer;

      font-size: 17px;
    }


    .admin-login-btn {

      width: 100%;

      margin-top: 28px;

      padding:
        16px 20px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #159fc8,
          #6870e6
        );

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 13px 30px
        rgba(76,113,215,.25);

      transition: .25s ease;
    }


    .admin-login-btn:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 18px 38px
        rgba(76,113,215,.32);
    }


    .admin-login-btn:disabled {

      opacity: .65;

      cursor:
        not-allowed;

      transform: none;
    }


    .back-home {

      display: inline-block;

      margin-top: 24px;

      color: #5d7387;

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;
    }


    .error {

      margin-top: 15px;

      padding:
        12px 14px;

      border-radius: 12px;

      background: #fff1f2;

      border:
        1px solid
        #ffd0d5;

      color: #b42318;

      font-size: 13px;

      font-weight: 700;

      text-align: center;

      line-height: 1.5;
    }


    .success {

      margin-top: 15px;

      padding:
        12px 14px;

      border-radius: 12px;

      background: #effcf5;

      border:
        1px solid
        #c9f0dc;

      color: #16734b;

      font-size: 13px;

      font-weight: 700;

      text-align: center;
    }


    /* =====================================
       DASHBOARD
    ===================================== */

    .dashboard-head {

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap: 20px;

      margin-bottom: 28px;
    }


    .dashboard-label {

      display: inline-block;

      color: #3b8ba6;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 1.5px;

      margin-bottom: 8px;
    }


    .dashboard-head h1 {

      margin: 0;

      font-size: 38px;

      color: #263852;

      letter-spacing: -.8px;
    }


    .dashboard-head p {

      margin:
        8px 0 0;

      color: #758497;

      font-size: 14px;
    }


    /* =====================================
       STATS
    ===================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }


    .stat-card {

      position: relative;

      overflow: hidden;

      padding: 25px;

      background:
        rgba(255,255,255,.9);

      border:
        1px solid
        #e4edf3;

      border-radius: 20px;

      box-shadow:
        0 12px 35px
        rgba(50,80,105,.07);
    }


    .stat-number {

      display: block;

      font-size: 34px;

      font-weight: 900;

      color: #263852;

      margin-bottom: 5px;
    }


    .stat-name {

      color: #78899b;

      font-size: 13px;

      font-weight: 700;
    }


    /* =====================================
       FILTER
    ===================================== */

    .filter-bar {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 10px;

      padding: 14px;

      margin-bottom: 22px;

      background:
        rgba(255,255,255,.9);

      border:
        1px solid
        #e2ebf1;

      border-radius: 17px;

      box-shadow:
        0 8px 25px
        rgba(50,80,105,.06);
    }


    .filter-btn {

      border: none;

      padding:
        10px 17px;

      border-radius: 10px;

      background: #f2f6f9;

      color: #62768a;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;
    }


    .filter-btn:hover,
    .filter-btn.active {

      background:
        linear-gradient(
          135deg,
          #159fc8,
          #6870e6
        );

      color: white;
    }


    /* =====================================
       PROBLEMS
    ===================================== */

    #problems {

      display: grid;

      gap: 18px;
    }


    .problem-card {

      background:
        rgba(255,255,255,.94);

      border:
        1px solid
        #e1ebf1;

      border-radius: 21px;

      padding: 25px;

      box-shadow:
        0 10px 32px
        rgba(50,80,105,.07);
    }


    .problem-top {

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 15px;

      margin-bottom: 14px;
    }


    .problem-title {

      margin: 0;

      color: #263852;

      font-size: 19px;

      line-height: 1.3;
    }


    .problem-id {

      margin-top: 5px;

      color: #94a2b0;

      font-size: 11px;

      font-weight: 700;
    }


    .portal-tag {

      display: inline-flex;

      padding:
        7px 11px;

      border-radius: 50px;

      background: #eef8fc;

      color: #3c8aa2;

      font-size: 10px;

      font-weight: 900;

      white-space: nowrap;
    }


    .problem-description {

      margin:
        14px 0;

      padding: 15px;

      border-radius: 13px;

      background: #f8fbfd;

      color: #52677b;

      font-size: 14px;

      line-height: 1.65;

      white-space: pre-wrap;
    }


    .problem-meta {

      display: flex;

      flex-wrap: wrap;

      gap: 9px;

      margin-bottom: 18px;
    }


    .meta-item {

      padding:
        7px 10px;

      border-radius: 9px;

      background: #f4f7fa;

      color: #66798c;

      font-size: 11px;

      font-weight: 700;
    }


    .urgent {

      background:
        #fff0f1 !important;

      color:
        #b42318 !important;
    }


    .problem-actions {

      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      padding-top: 17px;

      border-top:
        1px solid
        #edf1f4;
    }


    .status-select {

      min-width: 160px;

      padding:
        10px 12px;

      border:
        1px solid
        #dce6ed;

      border-radius: 10px;

      background: white;

      color: #506579;

      font-size: 12px;

      font-weight: 700;

      outline: none;
    }


    .note-input {

      flex: 1;

      min-width: 220px;

      padding:
        10px 12px;

      border:
        1px solid
        #dce6ed;

      border-radius: 10px;

      outline: none;

      font-size: 12px;
    }


    .save-btn {

      padding:
        11px 17px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #159fc8,
          #6870e6
        );

      color: white;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;
    }


    .empty-state {

      padding:
        55px 20px;

      text-align: center;

      background:
        rgba(255,255,255,.85);

      border:
        1px dashed
        #d6e2ea;

      border-radius: 20px;

      color: #7b8b9b;
    }


    .empty-icon {

      font-size: 40px;

      margin-bottom: 10px;
    }


    .loading {

      text-align: center;

      padding: 40px;

      color: #7b8b9b;
    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 850px) {

      .stats {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 700px) {

      .admin-topbar {

        padding: 0 4%;

        min-height: 68px;
      }


      .admin-brand {

        font-size: 13px;
      }


      .admin-brand-icon {

        width: 36px;

        height: 36px;

        font-size: 18px;
      }


      .admin-title {

        display: none;
      }


      .admin-wrap {

        width: 92%;

        padding-top: 28px;
      }


      .login-card {

        padding:
          32px 22px;

        margin-top: 10px;

        border-radius: 25px;
      }


      .login-card h1 {

        font-size: 29px;
      }


      .stats {

        grid-template-columns: 1fr;
      }


      .problem-top {

        flex-direction:
          column;
      }


      .problem-actions {

        flex-direction:
          column;

        align-items:
          stretch;
      }


      .status-select,
      .note-input,
      .save-btn {

        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       TOP BAR
  ===================================== -->

  <header class="admin-topbar">

    <a
      href="/"
      class="admin-brand"
    >

      <span
        class="admin-brand-icon"
      >
        🤝
      </span>

      <span>
        SEVA SWASTHYA
      </span>

    </a>


    <span class="admin-title">
      ADMIN PORTAL
    </span>


    <button id="logout">
      Logout
    </button>

  </header>


  <!-- =====================================
       MAIN
  ===================================== -->

  <main class="admin-wrap">


    <!-- ===================================
         LOGIN
    =================================== -->

    <section
      id="loginCard"
      class="login-card"
    >

      <div class="login-logo">
        🤝
      </div>


      <span class="login-badge">
        🔐 SECURE ADMIN PORTAL
      </span>


      <h1>
        Welcome back
      </h1>


      <p class="muted">
        Sign in to manage and respond
        to submitted concerns.
      </p>


      <form id="loginForm">


        <label>

          Username

          <div class="input-box">

            <span>
              👤
            </span>

            <input
              name="username"
              required
              autocomplete="username"
              placeholder="Enter your username"
            >

          </div>

        </label>


        <label>

          Password

          <div class="input-box">

            <span>
              🔑
            </span>

            <input
              id="adminPassword"
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </label>


        <button
          type="submit"
          class="admin-login-btn"
          id="loginButton"
        >
          Login to Dashboard →
        </button>


        <div id="loginMsg"></div>


      </form>


      <a
        href="/"
        class="back-home"
      >
        ← Back to Seva Swasthya
      </a>

    </section>


    <!-- ===================================
         DASHBOARD
    =================================== -->

    <section
      id="dashboard"
      style="display:none;"
    >


      <div class="dashboard-head">

        <div>

          <span class="dashboard-label">
            ADMIN DASHBOARD
          </span>

          <h1>
            Problems Dashboard
          </h1>

          <p id="adminInfo">
            Loading administrator information...
          </p>

        </div>

      </div>


      <!-- STATS -->

      <div class="stats">


        <div class="stat-card">

          <span
            id="newCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-name">
            New Concerns
          </span>

        </div>


        <div class="stat-card">

          <span
            id="progressCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-name">
            In Progress
          </span>

        </div>


        <div class="stat-card">

          <span
            id="resolvedCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-name">
            Resolved
          </span>

        </div>


        <div class="stat-card">

          <span
            id="totalCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-name">
            Total Concerns
          </span>

        </div>


      </div>


      <!-- FILTER -->

      <div class="filter-bar">


        <button
          class="filter-btn active"
          data-filter="all"
        >
          All
        </button>


        <button
          class="filter-btn"
          data-filter="new"
        >
          New
        </button>


        <button
          class="filter-btn"
          data-filter="in_progress"
        >
          In Progress
        </button>


        <button
          class="filter-btn"
          data-filter="resolved"
        >
          Resolved
        </button>


        <button
          class="filter-btn"
          id="refreshBtn"
          data-filter="refresh"
        >
          🔄 Refresh
        </button>


      </div>


      <!-- PROBLEMS -->

      <div id="problems">

        <div class="loading">
          Loading concerns...
        </div>

      </div>


    </section>


  </main>


  <script>

    // ==================================================
    // VARIABLES
    // ==================================================

    let currentAdmin = null;

    let allProblems = [];

    let currentFilter = "all";


    // ==================================================
    // PASSWORD TOGGLE
    // ==================================================

    document
      .getElementById("passwordToggle")
      .addEventListener(
        "click",
        function() {

          const input =
            document.getElementById(
              "adminPassword"
            );

          if (
            input.type ===
            "password"
          ) {

            input.type =
              "text";

            this.textContent =
              "🙈";

          } else {

            input.type =
              "password";

            this.textContent =
              "👁";

          }

        }
      );


    // ==================================================
    // API HELPER
    // ==================================================

    async function api(
      url,
      options = {}
    ) {

      const response =
        await fetch(
          url,
          {
            credentials: "same-origin",
            ...options
          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = {};

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `Server returned ${response.status}`
        );

      }


      return data;

    }


    // ==================================================
    // SESSION
    // ==================================================

    async function loadSession() {

      try {

        const data =
          await api(
            "/api/session"
          );


        if (
          data.loggedIn &&
          data.admin
        ) {

          currentAdmin =
            data.admin;

          showDashboard();

        }

      } catch (error) {

        console.error(
          "Session error:",
          error
        );

        showLoginError(
          "Server connection problem. Please make sure the Render service is running."
        );

      }

    }


    // ==================================================
    // LOGIN
    // ==================================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const loginMsg =
            document.getElementById(
              "loginMsg"
            );


          const button =
            document.getElementById(
              "loginButton"
            );


          loginMsg.textContent =
            "";

          loginMsg.className =
            "";


          const formData =
            new FormData(
              this
            );


          const data = {
            username:
              String(
                formData.get(
                  "username"
                ) || ""
              ).trim(),

            password:
              String(
                formData.get(
                  "password"
                ) || ""
              )
          };


          button.disabled =
            true;

          button.textContent =
            "Checking login...";


          try {

            const result =
              await api(
                "/api/login",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify(
                      data
                    )
                }
              );


            currentAdmin =
              result.admin;


            this.reset();


            showDashboard();


          } catch (error) {

            console.error(
              "Login error:",
              error
            );


            loginMsg.className =
              "error";


            loginMsg.textContent =
              error.message ||
              "Unable to login.";


          } finally {

            button.disabled =
              false;

            button.textContent =
              "Login to Dashboard →";

          }

        }
      );


    // ==================================================
    // SHOW LOGIN ERROR
    // ==================================================

    function showLoginError(
      message
    ) {

      const msg =
        document.getElementById(
          "loginMsg"
        );


      msg.className =
        "error";

      msg.textContent =
        message;

    }


    // ==================================================
    // SHOW DASHBOARD
    // ==================================================

    function showDashboard() {

      document.getElementById(
        "loginCard"
      ).style.display =
        "none";


      document.getElementById(
        "dashboard"
      ).style.display =
        "block";


      document.getElementById(
        "logout"
      ).style.display =
        "block";


      document.getElementById(
        "adminInfo"
      ).textContent =
        "Logged in as " +
        currentAdmin.username +
        " • " +
        getRoleName(
          currentAdmin.role
        );


      refresh();

    }


    // ==================================================
    // ROLE NAME
    // ==================================================

    function getRoleName(
      role
    ) {

      const names = {

        mental:
          "Mental Health Admin",

        physical:
          "Physical Health Admin",

        financial:
          "Financial Health Admin",

        super:
          "Super Admin"

      };


      return (
        names[role] ||
        role
      );

    }


    // ==================================================
    // LOGOUT
    // ==================================================

    document
      .getElementById("logout")
      .addEventListener(
        "click",
        async function() {

          try {

            await api(
              "/api/logout",
              {
                method: "POST"
              }
            );

          } catch (error) {

            console.error(
              "Logout error:",
              error
            );

          } finally {

            location.reload();

          }

        }
      );


    // ==================================================
    // FILTERS
    // ==================================================

    document
      .querySelectorAll(
        ".filter-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            function() {

              if (
                this.dataset.filter ===
                "refresh"
              ) {

                refresh();

                return;

              }


              document
                .querySelectorAll(
                  ".filter-btn"
                )
                .forEach(
                  btn =>
                    btn.classList.remove(
                      "active"
                    )
                );


              this.classList.add(
                "active"
              );


              currentFilter =
                this.dataset.filter;


              renderProblems();

            }
          );

        }
      );


    // ==================================================
    // REFRESH
    // ==================================================

    async function refresh() {

      const container =
        document.getElementById(
          "problems"
        );


      container.innerHTML = `
        <div class="loading">
          Loading concerns...
        </div>
      `;


      try {

        const [
          problems,
          stats
        ] = await Promise.all([

          api(
            "/api/problems"
          ),

          api(
            "/api/stats"
          )

        ]);


        allProblems =
          Array.isArray(
            problems
          )
            ? problems
            : (
                problems.problems ||
                []
              );


        updateStats(
          stats
        );


        renderProblems();


      } catch (error) {

        console.error(
          "Dashboard error:",
          error
        );


        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              ⚠️
            </div>

            <strong>
              Unable to load concerns
            </strong>

            <p>
              ${escapeHtml(
                error.message
              )}
            </p>

          </div>

        `;

      }

    }


    // ==================================================
    // STATS
    // ==================================================

    function updateStats(
      data
    ) {

      document.getElementById(
        "newCount"
      ).textContent =
        data.new || 0;


      document.getElementById(
        "progressCount"
      ).textContent =
        data.in_progress || 0;


      document.getElementById(
        "resolvedCount"
      ).textContent =
        data.resolved || 0;


      document.getElementById(
        "totalCount"
      ).textContent =
        data.total || 0;

    }


    // ==================================================
    // RENDER PROBLEMS
    // ==================================================

    function renderProblems() {

      const container =
        document.getElementById(
          "problems"
        );


      let problems =
        [...allProblems];


      if (
        currentFilter !==
        "all"
      ) {

        problems =
          problems.filter(
            problem =>
              problem.status ===
              currentFilter
          );

      }


      if (
        !problems.length
      ) {

        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              📭
            </div>

            <strong>
              No concerns found
            </strong>

            <p>
              There are no concerns in this category.
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML =
        problems
          .map(
            createProblemCard
          )
          .join("");

    }


    // ==================================================
    // CREATE PROBLEM CARD
    // ==================================================

    function createProblemCard(
      problem
    ) {

      const portalNames = {

        mental:
          "🧠 Mental Health",

        physical:
          "💪 Physical Health",

        financial:
          "💰 Financial Health"

      };


      const portalName =
        portalNames[
          problem.portal
        ] ||
        "General";


      const status =
        problem.status ||
        "new";


      const name =
        problem.anonymous
          ? "Anonymous"
          : (
              problem.name ||
              "Not provided"
            );


      const phone =
        problem.anonymous
          ? "Hidden"
          : (
              problem.phone ||
              "Not provided"
            );


      const urgency =
        problem.urgency ||
        "normal";


      const created =
        problem.created_at
          ? formatDate(
              problem.created_at
            )
          : "Date unavailable";


      const title =
        escapeHtml(
          problem.title ||
          "Untitled concern"
        );


      const description =
        escapeHtml(
          problem.description ||
          "No description provided."
        );


      const note =
        escapeHtml(
          problem.admin_note ||
          ""
        );


      return `

        <article
          class="problem-card"
        >

          <div class="problem-top">

            <div>

              <h3
                class="problem-title"
              >
                ${title}
              </h3>

              <div
                class="problem-id"
              >
                Reference #${problem.id}
              </div>

            </div>


            <span
              class="portal-tag"
            >
              ${portalName}
            </span>

          </div>


          <div class="problem-meta">

            <span
              class="meta-item"
            >
              👤
              ${escapeHtml(
                name
              )}
            </span>


            <span
              class="meta-item"
            >
              📱
              ${escapeHtml(
                phone
              )}
            </span>


            <span
              class="meta-item"
            >
              🕒
              ${created}
            </span>


            <span
              class="
                meta-item
                ${
                  urgency ===
                  "urgent"
                    ? "urgent"
                    : ""
                }
              "
            >

              ${
                urgency ===
                "urgent"
                  ? "🚨 URGENT"
                  : "Normal"
              }

            </span>

          </div>


          <div
            class="problem-description"
          >
            ${description}
          </div>


          <div
            class="problem-actions"
          >

            <select
              class="status-select"
              id="status-${problem.id}"
            >

              <option
                value="new"
                ${
                  status ===
                  "new"
                    ? "selected"
                    : ""
                }
              >
                New
              </option>


              <option
                value="in_progress"
                ${
                  status ===
                  "in_progress"
                    ? "selected"
                    : ""
                }
              >
                In Progress
              </option>


              <option
                value="resolved"
                ${
                  status ===
                  "resolved"
                    ? "selected"
                    : ""
                }
              >
                Resolved
              </option>

            </select>


            <input
              class="note-input"
              id="note-${problem.id}"
              value="${note}"
              placeholder="Add admin note..."
            >


            <button
              class="save-btn"
              onclick="saveProblem(${problem.id})"
            >
              Save Changes
            </button>

          </div>

        </article>

      `;

    }


    // ==================================================
    // SAVE PROBLEM
    // ==================================================

    async function saveProblem(
      id
    ) {

      const status =
        document.getElementById(
          "status-" + id
        ).value;


      const adminNote =
        document.getElementById(
          "note-" + id
        ).value;


      try {

        await api(
          "/api/problems/" + id,
          {
            method: "PATCH",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                status,
                admin_note:
                  adminNote
              })
          }
        );


        await refresh();


        alert(
          "Concern updated successfully."
        );


      } catch (error) {

        console.error(
          "Save error:",
          error
        );


        alert(
          error.message ||
          "Unable to update concern."
        );

      }

    }


    // ==================================================
    // DATE
    // ==================================================

    function formatDate(
      value
    ) {

      try {

        return new Date(
          value
        ).toLocaleString(
          "en-IN",
          {
            dateStyle:
              "medium",

            timeStyle:
              "short"
          }
        );

      } catch {

        return value;

      }

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==================================================
    // START
    // ==================================================

    loadSession();

  </script>

</body>

</html>
